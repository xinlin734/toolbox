name: mac-heartbeat

# Warns the owner when the checkout Mac stops sending heartbeats
# (.github/scripts/mac_heartbeat.sh). check-us.yml runs the same check on
# every run, since GitHub's schedule fires late or not at all on a busy
# repo; this is the backup.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  STALE_MINUTES: "15"
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_TRIGGER: ${{ secrets.MAC_TRIGGER }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: bash .github/scripts/mac_heartbeat.sh
