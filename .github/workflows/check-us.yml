name: check-us

# Each run watches for WATCH_MINUTES on one runner and starts the next run on a
# fresh runner shortly before it ends; the schedule is only a backup for a
# broken chain. Short runs keep each runner well under the number of requests
# after which Apple starts refusing one IP. If Apple refuses anyway, the run
# logs it on the "检查被拦记录" issue and a rescue run on a fresh runner takes
# over at once. Pickup is checked every minute (every 5 minutes while Apple
# has it switched off, until MINUTE_FROM), every 30 seconds while a store
# shows stock; delivery dates every 5 minutes.
#
# The repo is public: product and ZIP come from the TARGET secret
# ("<product> <zip>"), and the checker's output stays on the runner.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "发一条测试提醒"
        type: boolean
        default: false
      order_test:
        description: "下单演练：一款现在买得到的产品页名和型号，例如 iphone-17-pro Pro Max（只推给 BARK_URL 那台）"
        type: string
        default: ""
      chained:
        description: "内部用：由上一轮自动启动"
        type: boolean
        default: false
      rescue:
        description: "内部用：被拦后换机器接替"
        type: boolean
        default: false
      until:
        description: "内部用：接替查到这个时间（epoch 秒）"
        type: string
        default: ""
      prev_run:
        description: "内部用：等这一轮结束再开始查"
        type: string
        default: ""
  push:
    paths:
      - check.py
      - .github/scripts/**
      - .github/workflows/check-us.yml

permissions:
  actions: write
  contents: read
  issues: write

env:
  WATCH_MINUTES: "4"
  # From this day (Los Angeles time) pickup is asked every minute even while
  # Apple still shows it switched off.
  MINUTE_FROM: "2026-10-23"
  BLOCK_ISSUE_TITLE: "检查被拦记录"
  # Bark quiet hours, per phone in BARK_URL / BARK_URL_2 order: silent pushes then.
  BARK_QUIET: "America/Los_Angeles 20-6; Asia/Shanghai 23-9"
  STOCK_ISSUE_TITLE: "有货可自提"
  GH_REPO: ${{ github.repository }}

jobs:
  # Chained and rescue runs always proceed. Anything else steps aside while
  # another run is active, so only one watcher chain queries Apple.
  gate:
    runs-on: ubuntu-latest
    outputs:
      busy: ${{ steps.gate.outputs.busy }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.test_alert || inputs.order_test != '')

      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_URL_2: ${{ secrets.BARK_URL_2 }}
          TARGET: ${{ secrets.TARGET }}
        run: |
          url=$(gh issue create --title "测试提醒" --body "@$OWNER 能收到这条，有货时也能收到。")
          gh issue close "$url" > /dev/null
          # Link to one model's page, the same kind of link a stock alert opens.
          part=$(python3 check.py --product "${TARGET%% *}" --location - --list-parts 2>/dev/null | grep -m1 '^M' || true)
          link=${part:+https://www.apple.com/shop/product/$part}
          python3 .github/scripts/push_bark.py "测试提醒" "能收到这条，有货时也能收到。
          ${link:+点开看看是不是直接进到某一款的购买页。}" "$link"

      # The real alert path for a model on sale now: one pickup check near the
      # ZIP, then the push a stock alert would send, to the first phone only.
      - name: Order drill
        if: github.event_name == 'workflow_dispatch' && inputs.order_test != ''
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
          TARGET: ${{ secrets.TARGET }}
          ORDER_TEST: ${{ inputs.order_test }}
        run: |
          read -r product model <<< "$ORDER_TEST"
          zip=${TARGET#* }
          echo "::add-mask::$zip"
          python3 check.py --product "$product" --location "$zip" ${model:+--model "$model"} \
            --hits-file hits.txt --link-file link.txt > run.log 2>&1 || true
          grep -m1 '共找到' run.log || true
          grep -o '[0-9]* 家店 × [0-9]* 个型号 → 可自提 [0-9]* 个' run.log || true
          grep -E '⚠️|拦截|失败|Apple 提示' run.log | head -3 || true
          [ -n "$model" ] && echo "结果里提到 $model 的行：$(grep -ci "$model" run.log || true)"
          link=$(head -n1 link.txt 2>/dev/null || true)
          if [ -z "$link" ]; then
            # Nothing to drill with: show what Apple answered (model names
            # and pickup status only, no stores) and send no push.
            echo "::warning::附近没查到可自提的${model:+ $model}，不推送"
            python3 check.py --product "$product" --location "$zip" --all > all.log 2>&1 || true
            grep -E '家店|Apple 提示|⚠️' all.log | head -3 || true
            # Each model row: "✔" if in stock, then the name before its part number.
            grep -E '^ {3}.*M[A-Z0-9]{4}LL/A' all.log | sed -E 's/ +M[A-Z0-9]{4}LL\/A.*//; s/^ +//; s/ +/ /g' \
              | sort | uniq -c | head -40
            exit 0
          fi
          python3 .github/scripts/push_bark.py "下单演练（不是 Duo）" "$(cat hits.txt)
          点开直接进这款的购买页" "$link"

      - name: Skip if another run is active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHAINED: ${{ github.event_name == 'workflow_dispatch' && (inputs.chained || inputs.rescue) }}
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.test_alert || inputs.order_test != '') }}
        run: |
          # A test run only sends its test.
          if [ "$TEST_ONLY" = "true" ]; then
            echo "busy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$CHAINED" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "busy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          others=$(gh run list --workflow check-us.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event != \"push\" and .status != \"completed\")] | length")
          echo "busy=$([ "$others" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.busy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # This run was started early so the hand-over leaves no gap. Wait for
      # the previous run to finish so its saved state (best delivery dates)
      # is restored below and Apple is asked by one runner at a time.
      - name: Wait for the previous run
        if: inputs.prev_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ inputs.prev_run }}
        run: |
          for i in $(seq 30); do
            [ "$(gh run view "$PREV" --json status --jq .status)" = completed ] && exit 0
            sleep 3
          done

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-us-${{ github.run_id }}
          restore-keys: state-us-

      - name: Check
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ secrets.TARGET }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_URL_2: ${{ secrets.BARK_URL_2 }}
          UNTIL: ${{ inputs.until }}
        run: |
          # A push only smoke-tests one round; a rescue run watches until the
          # run it replaces would have ended.
          now=$(date +%s)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then duration=0
          elif [ -n "$UNTIL" ]; then duration=$(( UNTIL - now > 0 ? UNTIL - now : 0 ))
          else duration=$((WATCH_MINUTES * 60)); fi
          echo "until=$(( now + duration ))" >> "$GITHUB_OUTPUT"
          closed=(--closed-interval 300)
          [[ "$(TZ=America/Los_Angeles date +%F)" < "$MINUTE_FROM" ]] || closed=()
          bash .github/scripts/run_check.sh us "$TARGET" \
            --watch 60 --hot-interval 30 --duration "$duration" "${closed[@]}" --stop-on-block \
            --hits-file hits.txt --link-file link.txt \
            --on-change "bash .github/scripts/notify_stock.sh hits.txt link.txt" \
            --delivery --delivery-file delivery.json \
            --on-delivery-change "python3 .github/scripts/notify_delivery.py delivery.json state/best.json"

      - name: Save state
        if: hashFiles('state/best.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-us-${{ github.run_id }}

      # Hand the rest of this run to a fresh runner, unless the next regular
      # run is about to take over anyway.
      - name: Log a block
        if: steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          UNTIL: ${{ steps.watch.outputs.until }}
        run: |
          if [ $(( UNTIL - $(date +%s) )) -gt 60 ]; then
            action="换机器失败，等下一轮接上"
            for i in 1 2 3; do
              if gh workflow run check-us.yml --ref "$GITHUB_REF_NAME" \
                   -f rescue=true -f until="$UNTIL" -f prev_run="$GITHUB_RUN_ID"; then
                action="已立即换新机器接着查"; break
              fi
              sleep 5
            done
          else
            action="下一轮马上换新机器接上"
          fi
          note="@$OWNER 美国在 $(date -u +%H:%M) UTC（北京时间 $(TZ=Asia/Shanghai date +%H:%M)）被 Apple 拦截，$action。[运行记录]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"
          num=$(gh issue list --state open --limit 100 --json number,title \
                --jq 'map(select(.title == env.BLOCK_ISSUE_TITLE)) | .[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$BLOCK_ISSUE_TITLE" --body "$note" > /dev/null
          else
            gh issue comment "$num" --body "$note" > /dev/null
          fi

  # Start the next run on a fresh runner shortly before this one's watcher
  # stops, so the hand-over leaves no gap.
  next:
    needs: gate
    if: >-
      github.event_name != 'push' && needs.gate.outputs.busy != 'true'
      && !inputs.rescue
    runs-on: ubuntu-latest
    steps:
      # Time the hand-over from when this run's watcher starts, which is when
      # the previous run has finished.
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ inputs.prev_run }}
        run: |
          for i in $(seq 30); do
            [ -z "$PREV" ] && break
            [ "$(gh run view "$PREV" --json status --jq .status)" = completed ] && break
            sleep 3
          done
          sleep $((WATCH_MINUTES * 60 - 45))
          for i in 1 2 3; do
            gh workflow run check-us.yml --ref "$GITHUB_REF_NAME" \
              -f chained=true -f prev_run="$GITHUB_RUN_ID" && break
            sleep 15
          done
