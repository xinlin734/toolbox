name: cn-control-test

# One-off probes for the China checker (not the live monitor). No alerts.
on:
  push:
    branches: [claude/cn-control-test]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Map mainland stores
        run: python3 discover_cn.py
