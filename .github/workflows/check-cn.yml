name: check-cn

# Same setup as check-us.yml for mainland China, pickup only and always once a
# minute, at every Apple Store in the country. The product comes from
# TARGET_CN ("<product> <省> <市>"); the stores come from the public location
# list below. Each nearby search reaches only the closest stores, so 13
# searches cover all 49 stores (mapped 2026-10-20). They run as three groups on
# three runners, at most 5 searches a minute each: one runner asking for all
# 13 every minute gets HTTP 541 from Apple within a few minutes.
#
# Even at 5 a minute a runner is refused after about 6 minutes, so each run
# watches for only 4 and the next run starts on fresh runners just before it
# ends. While a place shows stock, that place alone is asked every 30 seconds.
# A refusal is logged on the "检查被拦记录" issue so it never goes unnoticed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "发一条测试提醒"
        type: boolean
        default: false
      chained:
        description: "内部用：由上一轮自动启动"
        type: boolean
        default: false
  push:
    paths:
      - check.py
      - .github/scripts/**
      - .github/workflows/check-cn.yml

permissions:
  actions: write
  contents: read
  issues: write

env:
  WATCH_MINUTES: "4"
  BLOCK_ISSUE_TITLE: "检查被拦记录"
  # Bark quiet hours, per phone in BARK_URL / BARK_URL_2 order: silent pushes then.
  BARK_QUIET: "America/Los_Angeles 20-6; Asia/Shanghai 23-9"
  GH_REPO: ${{ github.repository }}

jobs:
  # Chained runs always proceed. Anything else steps aside while another run
  # is active, so only one set of watchers queries Apple at a time.
  gate:
    runs-on: ubuntu-latest
    outputs:
      busy: ${{ steps.gate.outputs.busy }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert

      - name: Test alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_URL_2: ${{ secrets.BARK_URL_2 }}
        run: |
          url=$(gh issue create --title "测试提醒" --body "@$OWNER 能收到这条，有货时也能收到。")
          gh issue close "$url" > /dev/null
          python3 .github/scripts/push_bark.py "测试提醒" "能收到这条，有货时也能收到。"

      - name: Skip if another run is active
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CHAINED: ${{ github.event_name == 'workflow_dispatch' && inputs.chained }}
        run: |
          if [ "$CHAINED" = "true" ] || [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "busy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          others=$(gh run list --workflow check-cn.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .event != \"push\" and .status != \"completed\")] | length")
          echo "busy=$([ "$others" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check:
    needs: gate
    if: needs.gate.outputs.busy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 北方
            # 北京 6, 天津 3, 济南, 沈阳 2, 青岛, 大连, 郑州, 武汉
            locations: "天津 天津; 辽宁 沈阳; 山东 烟台; 河南 郑州; 湖北 武汉"
          - group: 华东
            # 上海 8, 杭州 2, 苏州, 宁波, 南京 3, 合肥, 无锡, 厦门, 福州, 温州
            locations: "浙江 宁波; 江苏 南京; 福建 厦门; 浙江 温州"
          - group: 南方
            # 广州 2, 深圳 3, 重庆 3, 成都 2, 长沙, 昆明, 南宁
            locations: "广东 广州; 重庆 重庆; 湖南 长沙; 云南 昆明; 广西壮族自治区 南宁"
    env:
      STOCK_ISSUE_TITLE: "有货可自提（国内·${{ matrix.group }}）"
    steps:
      - uses: actions/checkout@v5

      - name: Check
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ secrets.TARGET_CN }}
          LOCATIONS: ${{ matrix.locations }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_URL_2: ${{ secrets.BARK_URL_2 }}
        run: |
          # A push only smoke-tests one round.
          duration=$([ "$GITHUB_EVENT_NAME" = "push" ] && echo 0 || echo $((WATCH_MINUTES * 60)))
          bash .github/scripts/run_check.sh cn "$TARGET" \
            --watch 60 --hot-interval 30 --duration "$duration" --stop-on-block \
            --hits-file hits.txt --on-change "bash .github/scripts/notify_stock.sh hits.txt"

      - name: Log a block
        if: steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          GROUP: ${{ matrix.group }}
        run: |
          note="@$OWNER 国内·$GROUP 在 $(date -u +%H:%M) UTC（北京时间 $(TZ=Asia/Shanghai date +%H:%M)）被 Apple 拦截，这组暂停到下一轮换机器（最多约 4 分钟）。[运行记录]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"
          num=$(gh issue list --state open --limit 100 --json number,title \
                --jq 'map(select(.title == env.BLOCK_ISSUE_TITLE)) | .[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$BLOCK_ISSUE_TITLE" --body "$note" > /dev/null
          else
            gh issue comment "$num" --body "$note" > /dev/null
          fi

  # Start the next run on fresh runners shortly before this one's watchers
  # stop, so the hand-over leaves no gap.
  next:
    needs: gate
    if: >-
      github.event_name != 'push' && needs.gate.outputs.busy != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep $((WATCH_MINUTES * 60 - 45))
          for i in 1 2 3; do
            gh workflow run check-cn.yml --ref "$GITHUB_REF_NAME" -f chained=true && break
            sleep 15
          done
