name: surge
run-name: surge ${{ inputs.region }} ${{ inputs.chain }} ${{ inputs.lane }}

# Once a store shows stock, the region is asked every 10 seconds until 30
# minutes after the last stock is gone: mainland China at all 49 stores, the
# US at every store near the ZIP. check-cn / check-us start this through
# surge.sh when they first see stock, and restart it if it breaks. Started by
# hand with keep_until, it also asks every 10 seconds until then without stock.
#
# One runner asking every 10 seconds would be refused by Apple within a few
# minutes, so each place group is shared by three runners ("lanes") on a
# common clock: each asks every place every 30 seconds, offset by 10 seconds
# from the others (surge_lanes.sh). A mainland group of 5 places is then 10
# queries a minute per runner, so each lane hands over to a fresh runner
# every CN_SECONDS, staying near 20 queries per runner, under the ~30 after
# which Apple starts refusing.
#
# Every lane is its own chain of single-job runs and the lanes hand over at
# staggered times, so only a few runners overlap at once: GitHub runs at most
# 20 jobs at a time across the regular checks and these. A refused lane
# restarts at once on a fresh runner (the other two lanes of its group keep
# asking meanwhile) and is logged on "检查被拦记录" like the regular checks.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "cn 或 us"
        type: choice
        options: [cn, us]
        default: cn
      keep_until:
        description: "没货也一直查到这个时间（epoch 秒），例如预计补货的时段"
        type: string
        default: ""
      chain:
        description: "内部用：这条接力的编号"
        type: string
        default: ""
      lane:
        description: "内部用：这次查哪一条"
        type: string
        default: ""
      start_at:
        description: "内部用：从这个时间开始查（epoch 秒）"
        type: string
        default: ""
      until:
        description: "内部用：查到这个时间（epoch 秒）"
        type: string
        default: ""

permissions:
  actions: write
  contents: read
  issues: write

env:
  PACE: "30"
  CN_SECONDS: "120"
  US_SECONDS: "240"
  # Lead time for the next runner to come up before a hand-over.
  LEAD_SECONDS: "35"
  BLOCK_ISSUE_TITLE: "检查被拦记录"
  BARK_QUIET: "America/Los_Angeles 20-6; Asia/Shanghai 23-9"
  GH_REPO: ${{ github.repository }}
  REGION: ${{ inputs.region }}
  KEEP_UNTIL: ${{ inputs.keep_until }}

jobs:
  # Start every lane, their first hand-overs spread out.
  start:
    if: inputs.lane == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Start the lanes
        env:
          GH_TOKEN: ${{ github.token }}
          START_AT: ${{ inputs.start_at }}
          CHAIN: ${{ inputs.chain }}
        run: |
          start_at=${START_AT:-$(( $(date +%s) + 45 ))}
          seconds=$([ "$REGION" = cn ] && echo "$CN_SECONDS" || echo "$US_SECONDS")
          lanes=$(bash .github/scripts/surge_lanes.sh "$REGION" | jq -r '.[].lane')
          n=$(wc -l <<< "$lanes") i=0
          while read -r lane; do
            until=$(( start_at + LEAD_SECONDS + 15 + i * seconds / n ))
            gh workflow run surge.yml --ref "$GITHUB_REF_NAME" -f region="$REGION" \
              -f chain="${CHAIN:-$GITHUB_RUN_ID}" -f lane="$lane" -f start_at="$start_at" -f until="$until" \
              ${KEEP_UNTIL:+-f keep_until="$KEEP_UNTIL"}
            i=$(( i + 1 ))
          done <<< "$lanes"
          echo "$n 条，从 $(date -d @"$start_at" -u +%T) UTC 开始"

  check:
    if: inputs.lane != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SURGE_REGION: ${{ inputs.region }}
      LANE: ${{ inputs.lane }}
      CHAIN: ${{ inputs.chain }}
    steps:
      - uses: actions/checkout@v5

      - name: Check
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TARGET: ${{ inputs.region == 'cn' && secrets.TARGET_CN || secrets.TARGET }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_URL_2: ${{ secrets.BARK_URL_2 }}
          START_AT: ${{ inputs.start_at }}
          UNTIL: ${{ inputs.until }}
        run: |
          lane=$(bash .github/scripts/surge_lanes.sh "$REGION" | jq -c --arg l "$LANE" '.[] | select(.lane == $l)')
          group=$(jq -r .group <<< "$lane") phase=$(jq -r .phase <<< "$lane")
          export LOCATIONS=$(jq -r .locations <<< "$lane")
          export STOCK_ISSUE_TITLE=$([ "$REGION" = cn ] && echo "有货可自提（国内·$group）" || echo "有货可自提")
          seconds=$([ "$REGION" = cn ] && echo "$CN_SECONDS" || echo "$US_SECONDS")
          start_at=${START_AT:-$(date +%s)}
          until=${UNTIL:-$(( start_at + seconds ))}
          echo "until=$until" >> "$GITHUB_OUTPUT"

          # Shortly before this runner stops, hand the lane to a fresh one,
          # as long as there was stock in the last 30 minutes (or keep_until).
          handover() {
            local wait=$(( until - LEAD_SECONDS - $(date +%s) ))
            [ "$wait" -gt 0 ] && sleep "$wait"
            if [ "${KEEP_UNTIL:-0}" -le "$until" ] && ! bash .github/scripts/surge.sh "$REGION" want; then
              echo "30 分钟内没再看到货，这条到此结束"; touch handed; return 0
            fi
            # If a lane was started twice, the older chain carries on.
            older=$(gh api "repos/$GH_REPO/actions/workflows/surge.yml/runs?per_page=50" \
              --jq "[.workflow_runs[] | select(.status != \"completed\")
                     | (.display_title | split(\" \")) | select(.[1] == \"$REGION\" and .[3] == \"$LANE\")
                     | .[2] | tonumber | select(. < $CHAIN)] | length")
            if [ "${older:-0}" -gt 0 ]; then
              echo "这条有更早的接力在跑，停下"; touch handed; return 0
            fi
            for i in 1 2 3; do
              gh workflow run surge.yml --ref "$GITHUB_REF_NAME" -f region="$REGION" -f chain="$CHAIN" \
                -f lane="$LANE" -f start_at="$until" ${KEEP_UNTIL:+-f keep_until="$KEEP_UNTIL"} \
                && { touch handed; return 0; }
              sleep 5
            done
          }
          handover & pid=$!

          bash .github/scripts/run_check.sh "$REGION" "$TARGET" \
            --pace "$PACE" --phase "$phase" --start-at "$start_at" --end-at "$until" --stop-on-block \
            --hits-file hits.txt --link-file link.txt \
            --on-change "bash .github/scripts/notify_stock.sh hits.txt link.txt"
          if grep -q '^code=2' "$GITHUB_OUTPUT" && [ ! -e handed ]; then
            # Refused: a fresh runner takes over the rest of this one's turn.
            kill "$pid" 2> /dev/null || true
            echo "rescue=1" >> "$GITHUB_OUTPUT"
          else
            wait "$pid" || true
          fi

      - name: Log a block
        if: steps.watch.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          UNTIL: ${{ steps.watch.outputs.until }}
          RESCUE: ${{ steps.watch.outputs.rescue }}
        run: |
          action="下一轮马上换新机器接上"
          if [ -n "$RESCUE" ]; then
            action="换机器失败，等下一轮接上"
            for i in 1 2 3; do
              if gh workflow run surge.yml --ref "$GITHUB_REF_NAME" -f region="$REGION" -f chain="$CHAIN" \
                   -f lane="$LANE" -f until="$UNTIL" ${KEEP_UNTIL:+-f keep_until="$KEEP_UNTIL"}; then
                action="已立即换新机器接着查"; break
              fi
              sleep 5
            done
          fi
          where=$([ "$REGION" = cn ] && echo "国内·${LANE%%:*}" || echo "美国")
          note="$where（10 秒加密检查）在 $(date -u +%H:%M) UTC（北京时间 $(TZ=Asia/Shanghai date +%H:%M)）被 Apple 拦截，$action。[运行记录]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)"
          num=$(gh issue list --state open --limit 100 --json number,title \
                --jq 'map(select(.title == env.BLOCK_ISSUE_TITLE)) | .[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "$BLOCK_ISSUE_TITLE" --body "$note" > /dev/null
          else
            gh issue comment "$num" --body "$note" > /dev/null
          fi
